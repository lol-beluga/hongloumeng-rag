name: Java service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: honglou_test
          MYSQL_USER: honglou
          MYSQL_PASSWORD: ci-test-only
          MYSQL_ROOT_PASSWORD: ci-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B verify
        working-directory: java-service
        env:
          HONGLOU_INTEGRATION: 'true'
          MYSQL_URL: jdbc:mysql://127.0.0.1:3306/honglou_test?connectionTimeZone=UTC&characterEncoding=UTF-8
          MYSQL_USER: honglou
          MYSQL_PASSWORD: ci-test-only
