server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/tasks;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
research.python=${RESEARCH_PYTHON:python}
research.project-dir=${RESEARCH_PROJECT_DIR:..}
research.workers=2
research.queue-capacity=8
research.timeout-seconds=240
research.cache.enabled=${RESEARCH_CACHE_ENABLED:false}
research.cache.namespace=${CACHE_NAMESPACE:honglou:local:v1:}
research.cache.ttl-seconds=900
research.cache.jitter-seconds=120
research.cache.negative-ttl-seconds=30
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
