server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/tasks;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
research.python=${RESEARCH_PYTHON:python}
research.project-dir=${RESEARCH_PROJECT_DIR:..}
research.workers=2
research.queue-capacity=8
research.timeout-seconds=240
